name: cloudinary clean-up
# owner 12 Nov: keep only the last 48 hours of videos and pictures (THIS page's folder only). owner 20 Nov: clean every 6 hours
# (was every 2nd day), and the run turns RED (GitHub e-mails you) when the Cloudinary login is refused, the usage cannot be read,
# or 80% of the monthly credits are used - Coimbatore's account was disabled on 20 Nov after a silent, refused clean-up.
# Prints counts only (the repo is public). Run by hand with "dry" to see the counts without deleting.
on:
  schedule:
    - cron: "40 1,7,13,19 * * *"      # every 6 hours: 07:10 / 13:10 / 19:10 / 01:10 IST
  workflow_dispatch:
    inputs:
      keep_hours: {description: "keep files newer than this many hours", default: "48", required: true}
      dry: {description: "dry run (count only, delete nothing)", type: boolean, default: true}
permissions:
  contents: read
env:
  CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
  CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
  CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
  CLOUDINARY_KEEP_HOURS: ${{ inputs.keep_hours || '48' }}
  CLOUDINARY_FULL_KEEP_HOURS: ${{ inputs.keep_hours || '48' }}
jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests==2.32.5
      - run: python poster/cloudclean.py --force --alert ${{ inputs.dry && '--dry' || '' }}
