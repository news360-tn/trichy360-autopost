name: keys-check
# owner 12 Nov: TEST ONLY - one tiny request per service to prove each GitHub secret works.
# Prints only OK / FAIL / NOT ADDED with the HTTP code - never a key, never a reply text. Nothing is posted, nothing is saved or committed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - name: Each key alone
        env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
        shell: python
        run: |
          import os, re, requests
          E = os.environ.get

          def short(r):
              m = ""
              try:
                  j = r.json()
                  m = str((j.get("error") or {}).get("message") if isinstance(j.get("error"), dict) else (j.get("error") or j.get("errors") or j.get("detail") or ""))
              except Exception:
                  pass
              m = re.sub(r"[A-Za-z0-9_\-]{24,}", "…", m)      # never echo anything that looks like a key
              return m[:120]

          def check(name, need, fn, good=(200,)):
              if not all(E(k) for k in need):
                  print(f"NOT ADDED  {name}"); return
              try:
                  r = fn()
                  ok = r.status_code in good
                  print(f"{'OK  ' if ok else 'FAIL'}       {name}  (HTTP {r.status_code}){'' if ok else '  ' + short(r)}")
              except Exception as e:
                  print(f"FAIL       {name}  ({type(e).__name__})")

          def bridge():
              r = requests.get(E("BRIDGE_URL"), params={"action": "ping", "key": E("BRIDGE_KEY")}, timeout=90)
              if r.status_code == 200 and '"ok":true' not in r.text.replace(" ", ""):
                  r.status_code = 401      # Apps Script answered, but refused the key
              return r
          check("BRIDGE_URL + BRIDGE_KEY", ["BRIDGE_URL", "BRIDGE_KEY"], bridge)
          check("GEMINI_API_KEY", ["GEMINI_API_KEY"],
                lambda: requests.get("https://generativelanguage.googleapis.com/v1beta/models", params={"pageSize": 1}, headers={"x-goog-api-key": E("GEMINI_API_KEY")}, timeout=30))
          check("GROQ_API_KEY", ["GROQ_API_KEY"],
                lambda: requests.get("https://api.groq.com/openai/v1/models", headers={"Authorization": "Bearer " + E("GROQ_API_KEY")}, timeout=30))
          check("CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID", ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"],
                lambda: requests.post(f"https://api.cloudflare.com/client/v4/accounts/{E('CLOUDFLARE_ACCOUNT_ID')}/ai/run/@cf/meta/llama-3.1-8b-instruct",
                                      headers={"Authorization": "Bearer " + E("CLOUDFLARE_API_TOKEN")}, json={"prompt": "hi", "max_tokens": 3}, timeout=60))
          check("NVIDIA_API_KEY", ["NVIDIA_API_KEY"],
                lambda: requests.post("https://integrate.api.nvidia.com/v1/chat/completions", headers={"Authorization": "Bearer " + E("NVIDIA_API_KEY")},
                                      json={"model": "meta/llama-3.1-8b-instruct", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 3}, timeout=60))
          # paid services: checked WITHOUT spending anything
          check("ANTHROPIC_API_KEY (paid, no charge for this check)", ["ANTHROPIC_API_KEY"],
                lambda: requests.get("https://api.anthropic.com/v1/models", headers={"x-api-key": E("ANTHROPIC_API_KEY"), "anthropic-version": "2023-06-01"}, timeout=30))
          # fal: status of a request id that does not exist -> 404 = key accepted, 401/403 = key refused (no image made, no charge)
          check("FAL_KEY (paid, no charge for this check)", ["FAL_KEY"],
                lambda: requests.get("https://queue.fal.run/fal-ai/flux/requests/00000000-0000-0000-0000-000000000000/status",
                                     headers={"Authorization": "Key " + E("FAL_KEY")}, timeout=30), good=(200, 404))
          check("SARVAM_API_KEY (optional)", ["SARVAM_API_KEY"],
                lambda: requests.post("https://api.sarvam.ai/v1/chat/completions", headers={"api-subscription-key": E("SARVAM_API_KEY")},
                                      json={"model": "sarvam-m", "messages": [{"role": "user", "content": "hi"}], "max_tokens": 3}, timeout=60))
          check("POLLINATIONS_API_KEY (optional)", ["POLLINATIONS_API_KEY"],
                lambda: requests.get("https://gen.pollinations.ai/image/test", params={"width": 64, "height": 64}, headers={"Authorization": "Bearer " + E("POLLINATIONS_API_KEY")}, timeout=60))
          check("TOGETHER_API_KEY (optional)", ["TOGETHER_API_KEY"],
                lambda: requests.get("https://api.together.xyz/v1/models", headers={"Authorization": "Bearer " + E("TOGETHER_API_KEY")}, timeout=30))
          for k in ("CLOUDINARY_CLOUD", "CLOUDINARY_PRESET"):
              print(("ADDED      " if E(k) else "NOT ADDED  ") + k + "  (needed before posting)")
