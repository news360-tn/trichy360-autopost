name: research-free-test
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "article URLs, space separated"
        required: true
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests
      - name: Run free-model test (does not touch the live sheet)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}      # owner 30 Oct: free writers (skipped until the key is set)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}      # owner 29 Oct: paid Claude ONLY when every free model failed / is out of quota
          ANTHROPIC_MODEL: claude-haiku-5-5      # owner 29 Oct: newest Haiku (older one only as automatic fallback)
        run: |
          mkdir -p research_free/results
          python -u research_free/run.py ${{ github.event.inputs.urls }} > research_free/results/run.log 2>&1 || echo "exit $?" >> research_free/results/run.log
          tail -5 research_free/results/run.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f research_free/results
          git commit -m "free-model test output" || echo none
          git pull --rebase --autostash origin main
          git push
