name: insights
on:
  workflow_dispatch:
  schedule:
    - cron: "40 20 * * *"      # 02:10 IST daily
permissions:
  contents: write
env:
  BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
  BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
jobs:
  insights:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install requests pillow
      - run: python poster/insights.py
      - name: Commit learned data
        run: |
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f poster/insights research_free/learned.json
          git commit -m "insights: learned data update" || echo none
          # 19 Nov: retry like the posting job - another job saving the same files at the same moment made the push fail
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash origin main && git push -q && break; git rebase --abort 2>/dev/null || true; sleep $((i*3)); done
