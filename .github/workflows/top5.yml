name: top5
# owner 28 Nov (approved after the samples): இன்றைய டாப் 5 - every evening one reel with today's 5 most watched news of this page
# (poster/top5.py). Not one of the day's 30 news. A run stops at once when today's top 5 is already posted (poster/top5_state).
on:
  schedule:
    - cron: "30 15 * * *"      # 21:00 IST
    - cron: "0 16 * * *"       # 21:30 IST backup (before 22:00, when only urgent news posts)
  workflow_dispatch:
    inputs:
      dry:
        description: "1 = make the reel only, do not post"
        default: "1"
permissions:
  contents: write
concurrency:
  group: top5-trichy
  cancel-in-progress: false
env:
  GH_MEDIA_TOKEN: ${{ github.token }}
jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PAGE: trichy
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry || '' }}
      BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
      BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
      CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
      CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET: news360-media
      R2_PUBLIC_URL: https://pub-ec316fa6a94f404c993596355ad19128.r2.dev
      FB_PAGE_ID_TRICHY: ${{ secrets.FB_PAGE_ID_TRICHY }}
      FB_TOKEN_TRICHY: ${{ secrets.FB_TOKEN_TRICHY }}
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Browser (cached)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-rasipalan-1.56.0
      - name: Install
        timeout-minutes: 15
        run: |
          pip install -q requests==2.32.5 pillow==11.3.0 playwright==1.56.0 pyswisseph==2.10.3.2 imageio-ffmpeg==0.6.0 numpy edge-tts==7.2.3
          python -m playwright install chromium
          python -c "from playwright.sync_api import sync_playwright as s; p=s().start(); p.chromium.launch().close(); p.stop()" ||
            sudo "$(command -v python)" -m playwright install-deps chromium
      - name: Make and post today's top 5
        run: python -u poster/top5.py
      - name: The reel for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: top5-trichy
          path: |
            out/top5/trichy/*.mp4
            out/top5/trichy/caption.txt
          if-no-files-found: ignore
      - name: Remember today's post (no second post today)
        if: always()
        run: |
          [ -n "$(git status --porcelain poster/top5_state poster/fb_posted)" ] || exit 0
          git config user.name "news360-bot"; git config user.email "news360-bot@users.noreply.github.com"
          git add -f poster/top5_state 2>/dev/null || true; if [ -d poster/fb_posted ]; then git add -f poster/fb_posted; fi
          git commit -qm "top5 posted"
          for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; git rebase --abort 2>/dev/null || true; sleep 5; done
