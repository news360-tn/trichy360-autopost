name: autofix
# owner 24 Nov ("post immediately all the news - daily some problem found"): every 30 minutes, news HELD by the fact-check (today's and
# yesterday's) are written again from the source article with the problems told to the writer; a clean version is saved in
# poster/fixed/ and the posting job posts that corrected text. At most 2 tries per news (research_free/autofix.py).
on:
  schedule:
    - cron: "1,31 0-17 * * *"      # owner 24 Nov: each page at its own minutes (the free AI writers were busy when all 7 ran together)
    - cron: "31 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: autofix
  cancel-in-progress: false
jobs:
  autofix:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -q requests==2.32.5 googlenewsdecoder==0.2.2 pillow==11.3.0
      - env:
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          AUTOFIX_MAX: "6"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}      # owner 30 Oct: free writers (skipped until the key is set)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}      # owner 27 Nov ("do not miss power cut news"): paid backup for POWER CUTS only
          ANTHROPIC_MODEL: claude-haiku-5-5
          AUTOFIX_CLAUDE: power_cut      # Trichy: every other held news stays free-models-only (research_free/autofix.py)
          CLAUDE_MAX_CALLS: "12"      # cost guard per run (a power-cut rewrite is ~3-4 calls)
          BUDGET_MIN: "50"
        run: mkdir -p research_free/results && python -u research_free/autofix.py 2>&1 | tee research_free/results/autofix.log
      - name: Save the corrected news
        run: |
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          [ -d poster/fixed ] || exit 0
          git add -f poster/fixed research_free/results/autofix.log
          git diff --cached --quiet && exit 0
          git commit -qm "autofix: corrected held news" && { for i in 1 2 3 4 5; do git pull -q --rebase -X theirs --autostash && git push -q && break; git rebase --abort 2>/dev/null || true; sleep $((i*3)); done; } || true
