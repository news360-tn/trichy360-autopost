name: write-stories
# owner 31 Oct: NO schedule - each research-free round (IST 04:00 ... 22:00, every 2 hours) writes its own top 3 and posts them.
# Run by hand only: writes the top 3 of today's waiting news (quality-checked, pictures made) and starts the posting job.
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: write      # starts the posting job as soon as a story is saved
concurrency: research-free-write      # owner 29 Oct: own queue (it used to cancel waiting collections); it skips its round while a collection runs
jobs:
  write:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - name: Check switch and queue
        id: sw
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          go=yes
          n=$(gh api "repos/${{ github.repository }}/actions/workflows/research_free.yml/runs?status=in_progress" -q '.total_count' 2>/dev/null || echo 0)
          q=$(gh api "repos/${{ github.repository }}/actions/workflows/research_free.yml/runs?status=queued" -q '.total_count' 2>/dev/null || echo 0)
          if [ "${n:-0}" != "0" ] || [ "${q:-0}" != "0" ]; then
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              # 29 Oct: the collector starts this writer just before it saves the queue - wait for it (max 12 min) and read the new queue
              for i in $(seq 1 24); do
                n=$(gh api "repos/${{ github.repository }}/actions/workflows/research_free.yml/runs?status=in_progress" -q '.total_count' 2>/dev/null || echo 0)
                [ "${n:-0}" = "0" ] && break
                echo "collection still saving - waiting ($i)"; sleep 30
              done
              git pull -q origin main || true
            else
              go=no; echo "collection is running - the writer skips this round"
            fi
          fi
          if [ "${{ github.event_name }}" = "schedule" ] && [ ! -f research_free/ENABLED ]; then go=no; fi
          if [ ! -s research_free/archive/queue.json ] || [ "$(tr -d '[:space:]' < research_free/archive/queue.json)" = "[]" ]; then go=no; echo "queue empty"; fi
          echo "go=$go" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.sw.outputs.go == 'yes'
        with: {python-version: "3.11"}
      - run: pip install requests googlenewsdecoder==0.2.2 pillow
        if: steps.sw.outputs.go == 'yes'
      - name: Optional photo tools (real news photos - super-resolution, AVIF); the story is written without them if this fails
        run: pip install -q opencv-contrib-python-headless==4.10.0.84 pillow-avif-plugin==1.4.6 || echo 'photo tools not installed'
        if: steps.sw.outputs.go == 'yes'
      - name: Write the queued news by priority, save each story, start posting
        if: steps.sw.outputs.go == 'yes'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}      # owner 30 Oct: free writers (skipped until the key is set)
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}      # paid pictures ONLY when no free source made one
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}      # owner 29 Oct: paid Claude ONLY when every free model failed / is out of quota
          ANTHROPIC_MODEL: claude-haiku-5-5      # owner 29 Oct: newest Haiku (older one only as automatic fallback)
          BRIDGE_URL: ${{ secrets.BRIDGE_URL }}
          BRIDGE_KEY: ${{ secrets.BRIDGE_KEY }}
          CLOUDINARY_CLOUD: ${{ secrets.CLOUDINARY_CLOUD }}
          CLOUDINARY_PRESET: ${{ secrets.CLOUDINARY_PRESET }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COLLECT_MODE: write
          BUDGET_MIN: "30"
          AUTO_IMAGES: "1"
          WRITE_STORIES: '1'
          WRITE_WORKERS: "3"
          FRESH_DAYS: "1"           # owner 29 Oct: news published TODAY only (Coimbatore)
          CITY_ONLY: "0"            # owner 31 Oct: the whole district
          DAILY_CAP: "1000"         # owner 31 Oct (4:48 PM): NO daily limit - every 2-hour round posts its top 3; only Instagram's own 50 a day applies
          MAX_STORIES: "3"          # owner 31 Oct: a hand run writes the top 3 too
        run: |
          mkdir -p research_free/results
          python -u research_free/collect.py > research_free/results/write.log 2>&1 || echo "exit $?" >> research_free/results/write.log
          tail -15 research_free/results/write.log
      - name: Save the queue and log
        if: always() && steps.sw.outputs.go == 'yes'
        run: |
          git config user.name "news360-bot"; git config user.email "bot@users.noreply.github.com"
          git add -f research_free/results research_free/archive
          git commit -m "story writer log" || echo none
          for i in 1 2 3 4 5; do git pull --rebase -X theirs --autostash origin main && git push && break; git rebase --abort 2>/dev/null || true; sleep $((i*4)); done || true
      - name: Fail loudly if the writer crashed (GitHub then emails the repo owner)
        if: steps.sw.outputs.go == 'yes'
        run: |
          if grep -q "Traceback" research_free/results/write.log; then echo "writer crashed"; exit 1; fi
